id: fire_pipeline_v01
name: Fire Pipeline V0.1
version: "0.1"
description: Minimal pipeline with one keyword-based noise filter.

runtime:
  stop_on_error: true
  save_trace: true

steps:
  - id: noise_filter
    name: Keyword Noise Filter
    enabled: true
    component: noise.keyword_filter
    params:
      keywords:
        - fire
        - smoke
        - burning
        - flames
        - wildfire
        - explosion
      threshold: 1
      positive_label: low_signal
      negative_label: noise
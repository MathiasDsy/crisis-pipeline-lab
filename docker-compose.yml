# Client stack — the whole application in one command:
#
#   docker compose up -d --build
#
# Brings up postgres, model-server, pipeline-api, photon and the frontend, with
# geocoding enabled by default. For local development with selectable profiles,
# use docker-compose.dev.yml instead.
services:
  model-server:
    build:
      context: ./backend
      dockerfile: model_api/Dockerfile
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    volumes:
      - ./backend/storage:/app/storage
      - ./models_cache:/models_cache
    environment:
      - PYTHONPATH=/app:/app/src
      - HF_HOME=/models_cache
      - HF_TOKEN=${HF_TOKEN:-}
      - MODELS_DIR=/app/storage/models
      - RELEVANCE_MODEL_PATH=/app/storage/models/relevance_model
      - GLINER_MODEL_PATH=/app/storage/models/gliner_multi-v2.1
    ports:
      - "8001:8001"
    healthcheck:
      # Consider the model server "up" only once its HTTP API answers.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  pipeline-api:
    build:
      context: ./backend
      dockerfile: app_api/Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://crisis:crisis@postgres:5432/crisis_db
      - MODEL_API_URL=http://model-server:8001
      - PHOTON_API_URL=http://photon:2322/api
      - GEOCODING_ENABLED=${GEOCODING_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      model-server:
        condition: service_healthy
      photon:
        condition: service_started
    healthcheck:
      # Consider the pipeline API "up" only once its HTTP API answers.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/admin/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  photon:
    build:
      context: ./services/photon
      dockerfile: Dockerfile
    ports:
      - "2322:2322"
    volumes:
      - ./services/photon/data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: crisis
      POSTGRES_DB: crisis_db
    ports:
      - "5432:5432"
    volumes:
      - crisis_postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisis -d crisis_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      # Dockerfile.dev only installs deps; the app source is provided here.
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped
    depends_on:
      pipeline-api:
        condition: service_healthy
      model-server:
        condition: service_healthy

volumes:
  crisis_postgres_data:
  models_cache:

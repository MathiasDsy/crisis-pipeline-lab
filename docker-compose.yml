services:
  model-server:
    build:
      context: ./backend
      dockerfile: model_api/Dockerfile
    container_name: crisis-model-server
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001
    volumes:
      - ./backend/model_api/src:/app/src
      - ./backend/shared:/app/shared
      - ./backend/storage:/app/storage
      - ./models_cache:/models_cache
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - HF_HOME=/models_cache
      - RELEVANCE_MODEL_PATH=/app/storage/models/relevance_model
      - GLINER_MODEL_PATH=/app/storage/models/gliner_multi-v2.1
    ports:
      - "8001:8001"
    restart: unless-stopped

  pipeline-api:
    build:
      context: ./backend
      dockerfile: app_api/Dockerfile
    container_name: crisis-pipeline-api
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app_api/src:/app/src
      - ./backend/shared:/app/shared
      - ./backend/storage:/app/storage
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://crisis:crisis@postgres:5432/crisis_db
      - MODEL_API_URL=http://model-server:8001
      - PHOTON_API_URL=http://photon:2322/api
    depends_on:
      - postgres
      - model-server
      - photon
    restart: unless-stopped

  photon:
    build:
      context: ./services/photon
      dockerfile: Dockerfile
    container_name: photon-croatia
    ports:
      - "2322:2322"
    volumes:
      - ./services/photon/data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: crisis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crisis
      POSTGRES_PASSWORD: crisis
      POSTGRES_DB: crisis_db
    ports:
      - "5432:5432"
    volumes:
      - crisis_postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: crisis-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
      - WATCHPACK_POLLING=true
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

volumes:
  crisis_postgres_data:
  models_cache:
